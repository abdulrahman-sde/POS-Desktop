name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [ci/windows-build]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-checks, bundles the app and builds the installer into dist/
      - name: Build the installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Runs the packaged app's own database engine, then every migration, on this Windows machine.
      - name: Smoke test the packaged app
        shell: bash
        run: |
          exe=$(find dist/win-unpacked -maxdepth 1 -name '*.exe' | head -n 1)
          echo "Using $exe"
          ELECTRON_RUN_AS_NODE=1 "$exe" scripts/smoke-test-packaged.cjs dist/win-unpacked smoke-result.txt
          cat smoke-result.txt

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: stockwise-windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30
